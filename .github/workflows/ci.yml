name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The one and only supported version: what Raspberry Pi OS
          # Bookworm ships on the Pi Zero W.
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
